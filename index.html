let audioCtx=null;
function playTasbihSound(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    const now=audioCtx.currentTime;
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type="sine";
    osc.frequency.setValueAtTime(660,now);
    osc.frequency.exponentialRampToValueAtTime(990,now+0.07);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.12,now+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+0.16);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now+0.17);
  }catch(e){}
}

function render(){
 const rows=Object.values(students).sort((a,b)=>b.count-a.count);
 $("students").innerHTML=rows.length?rows.map(s=>`<tr><td>${escapeHtml(s.name)}</td><td class="num">${s.count}</td></tr>`).join(""):`<tr><td colspan="2">لم يدخل أي تلميذ بعد</td></tr>`;
 $("total").textContent=total();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function broadcast(m){conns=conns.filter(c=>c.open);conns.forEach(c=>c.send(m))}
function sendAllState(){broadcast({type:"state",students});render()}

$("teacher").onclick=()=>{
 $("roleBox").style.display="none";$("teacherPanel").style.display="block";
 const id="tasbih-"+Math.random().toString(36).slice(2,8).toUpperCase();peer=new Peer(id);
 peer.on("open",()=>{$("room").textContent=id.replace("tasbih-","");$("teacherStatus").textContent="الغرفة جاهزة ✓"});
 peer.on("connection",c=>{
   conns.push(c);
   c.on("data",m=>{
     if(m.type==="join"){
       students[c.peer]={name:m.name,count:0}; c.studentKey=c.peer;
       c.send({type:"state",students}); render(); broadcast({type:"state",students});
     }
     if(m.type==="add" && students[c.peer]){
       students[c.peer].count++; render(); broadcast({type:"state",students});
     }
   });
   c.on("close",()=>{delete students[c.peer];render();broadcast({type:"state",students})});
 });
 $("reset").onclick=()=>{if(confirm("إعادة عداد جميع التلاميذ إلى صفر؟")){Object.values(students).forEach(s=>s.count=0);sendAllState()}};
};

$("student").onclick=()=>{$("roleBox").style.display="none";$("studentPanel").style.display="block"};
$("join").onclick=()=>{
 myName=$("name").value.trim(); const code=$("code").value.trim().toUpperCase();
 if(!myName||!code){$("studentStatus").textContent="اكتب اسمك ورمز الغرفة.";return}
 peer=new Peer();
 peer.on("open",()=>{
   myConn=peer.connect("tasbih-"+code);
   myConn.on("open",()=>{myConn.send({type:"join",name:myName});$("studentStatus").textContent="متصل ✓"});
   myConn.on("data",m=>{if(m.type==="state"){const me=Object.values(m.students).find(s=>s.name===myName);myCount=me?me.count:myCount;$("myCount").textContent=myCount;}});
   myConn.on("close",()=>{$("studentStatus").textContent="انقطع الاتصال.";});
 });
};
$("btn").onclick=()=>{playTasbihSound();if(myConn&&myConn.open){myConn.send({type:"add"});myCount++;$("myCount").textContent=myCount;}};
</script>
</body></html>
